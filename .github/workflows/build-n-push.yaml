---
name: Build and Push
jobs:
  verify:
    name: Read-only build and safety checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Offline publication guard tests
      run: python3 -m unittest discover -s .github/tests -v
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: "."
        push: false
  build-image:
    name: Publish private GHCR candidate
    runs-on: ubuntu-latest
    needs:
    - verify
    if: "${{ github.event_name == 'push' && github.ref_protected && vars.GHCR_PUBLISH_ENABLED
      == 'true' }}"
    permissions:
      contents: read
      packages: write
    concurrency:
      group: "${{ github.workflow }}-ghcr-${{ github.ref }}"
      cancel-in-progress: false
    outputs:
      tags_name: "${{ steps.publish.outputs.image_tag }}"
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify existing private GHCR package and protected publication
      id: publish
      env:
        GH_TOKEN: "${{ github.token }}"
        GHCR_PACKAGE: postgresql
        GHCR_PUBLISH_ENABLED: "${{ vars.GHCR_PUBLISH_ENABLED }}"
      run: bash .github/scripts/verify-ghcr-publish.sh
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: "${{ github.actor }}"
        password: "${{ github.token }}"
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      name: Build and publish a unique GHCR candidate tag
      with:
        context: "."
        push: true
        tags: ghcr.io/leukocyte-lab/postgresql:${{ steps.publish.outputs.image_tag
          }}
        labels: |-
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
'on':
  push:
    branches:
    - master
    - develop
    - releases/**
    tags:
    - v*
  pull_request:
    branches:
    - master
    - develop
    - releases/**
permissions:
  contents: read
